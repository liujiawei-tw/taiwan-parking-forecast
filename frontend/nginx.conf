map $request_method $parking_query_create_limit_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $parking_query_create_limit_key zone=parking_query_create:10m rate=5r/m;

# 僅信任私有網路中的前置反向代理所提供的用戶端位址；遠端 web 埠只綁定主機 loopback。
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  limit_req_status 429;
  error_page 429 = @parking_query_rate_limited;

  location = /api/v1/parking-queries {
    limit_req zone=parking_query_create burst=2 nodelay;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
  }

  location /api/ {
    # proxy_pass 不附 URI，保留 /api/v1/... 完整路徑交給 Spring Boot。
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
  }

  location @parking_query_rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"建立查詢次數已達限制，請稍後再試。","details":{"limit":"5 requests per minute","burst":2},"retryable":true,"nextAllowedAt":null},"serverTime":null}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
