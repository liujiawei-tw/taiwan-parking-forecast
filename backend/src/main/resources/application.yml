spring:
  application:
    name: taiwan-parking-forecast-api
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}
  # The API is reachable only from the web proxy in Compose. Nginx replaces
  # client-supplied forwarding metadata with its validated proxy view.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


parking:
  google:
    routes:
      base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
      compute-routes-path: ${GOOGLE_ROUTES_COMPUTE_ROUTES_PATH:/directions/v2:computeRoutes}
      timeout: ${GOOGLE_ROUTES_TIMEOUT:10s}
      external-calls-enabled: ${GOOGLE_ROUTES_EXTERNAL_CALLS_ENABLED:false}
      api-key: ${GOOGLE_ROUTES_SERVER_API_KEY:}
      travel-mode: ${GOOGLE_ROUTES_TRAVEL_MODE:DRIVE}
      routing-preference: ${GOOGLE_ROUTES_ROUTING_PREFERENCE:TRAFFIC_AWARE_OPTIMAL}
      field-mask: ${GOOGLE_ROUTES_FIELD_MASK:routes.duration,routes.staticDuration,routes.distanceMeters}

  sources:
    ntpc:
      base-url: ${NTPC_OPEN_DATA_BASE_URL:https://data.ntpc.gov.tw}
      timeout: ${NTPC_OPEN_DATA_TIMEOUT:10s}
      max-attempts: ${NTPC_OPEN_DATA_MAX_ATTEMPTS:1}
      external-calls-enabled: ${NTPC_OPEN_DATA_EXTERNAL_CALLS_ENABLED:true}
      roadside:
        dataset-id: ${NTPC_ROADSIDE_AVAILABILITY_DATASET_ID:54A507C4-C038-41B5-BF60-BBECB9D052C6}
        json-path: ${NTPC_ROADSIDE_AVAILABILITY_JSON_PATH:/api/datasets/{datasetId}/json}
      off-street:
        dataset-id: ${NTPC_OFF_STREET_AVAILABILITY_DATASET_ID:e09b35a5-a738-48cc-b0f5-570b67ad9c78}
        json-path: ${NTPC_OFF_STREET_AVAILABILITY_JSON_PATH:/api/datasets/{datasetId}/json}
      off-street-catalog:
        dataset-id: ${NTPC_OFF_STREET_CATALOG_DATASET_ID:B1464EF0-9C7C-4A6F-ABF7-6BDF32847E68}
        json-path: ${NTPC_OFF_STREET_CATALOG_JSON_PATH:/api/datasets/{datasetId}/json}

  catalog:
    ntpc:
      page-size: ${NTPC_CATALOG_DRY_RUN_PAGE_SIZE:1000}
      max-pages: ${NTPC_CATALOG_DRY_RUN_MAX_PAGES:50}
      command:
        enabled: ${NTPC_CATALOG_IMPORT_COMMAND_ENABLED:false}
        confirm-write: ${NTPC_CATALOG_IMPORT_CONFIRM_WRITE:false}
        reviewed-subset: ${NTPC_CATALOG_IMPORT_REVIEWED_SUBSET:false}
        expected-manifest-sha256: ${NTPC_CATALOG_IMPORT_EXPECTED_MANIFEST_SHA256:}
        service-area: ${NTPC_CATALOG_IMPORT_SERVICE_AREA:NEW_TAIPEI_XINZHUANG}
      scopes:
        - service-area: ${NTPC_CATALOG_SCOPE_0_SERVICE_AREA:NEW_TAIPEI_XINZHUANG}
          roadside-area-code: ${NTPC_CATALOG_SCOPE_0_ROADSIDE_AREA_CODE:65000050}
          off-street-area-name: ${NTPC_CATALOG_SCOPE_0_OFF_STREET_AREA_NAME:新莊區}

  refresh:
    source-cooldown: ${PARKING_REFRESH_SOURCE_COOLDOWN:5m}
    lock-ttl: ${PARKING_REFRESH_LOCK_TTL:90s}
    page-size: ${PARKING_REFRESH_PAGE_SIZE:40000}
    max-pages: ${PARKING_REFRESH_MAX_PAGES:3}
    measurement:
      command:
        enabled: ${PARKING_REFRESH_MEASUREMENT_COMMAND_ENABLED:false}

  query-state:
    store: ${PARKING_QUERY_STATE_STORE:redis}
    ttl: ${PARKING_QUERY_STATE_TTL:30m}
    expired-state-retention: ${PARKING_QUERY_STATE_EXPIRED_RETENTION:30m}
