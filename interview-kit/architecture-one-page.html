<style>

  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1680px; margin:0 auto; padding:14px 20px 10px; }
  .toolbar .hint { color:#53677d; font-size:14px; line-height:1.5; }
  .actions { display:flex; gap:8px; }
  button { appearance:none; border:1px solid #cbd7e4; background:#fff; color:#163a63; border-radius:9px; padding:9px 13px; font:inherit; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#edf5ff; border-color:#8eb7e7; }
  button:focus-visible { outline:3px solid #79b6ff; outline-offset:2px; }
  main { max-width:1680px; margin:0 auto; padding:0 12px 20px; }
  .canvas { overflow:auto; border:1px solid #d8e2ed; border-radius:16px; background:#fff; box-shadow:0 10px 35px rgba(24,54,89,.09); }
  svg { display:block; width:100%; height:auto; min-width:1000px; background:#fff; }
  .footer-note { padding:12px 16px 16px; color:#5b6e82; font-size:13px; line-height:1.6; }
  @media (max-width:700px) { .toolbar { padding:12px; } main { padding:0 8px 12px; } .toolbar .hint { font-size:12px; } }
  @media print {
    @page { size:A3 landscape; margin:8mm; }
    html,body { background:#fff; }
    .toolbar,.footer-note { display:none !important; }
    main { max-width:none; padding:0; }
    .canvas { overflow:visible; border:0; border-radius:0; box-shadow:none; }
    svg { width:100%; min-width:0; }
  }
</style>
</head>
