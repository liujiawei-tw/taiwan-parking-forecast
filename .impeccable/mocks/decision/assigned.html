<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>路側導引牌｜首屏草圖</title>
<style>
:root{--paper:#f4f0e5;--ink:#132b3a;--green:#16824b;--red:#cf3e35;--gold:#d4a52c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.35 system-ui,"Noto Sans TC",sans-serif}.app{height:844px;position:relative;overflow:hidden;background:#e3e8d8}.map{position:absolute;inset:0;background:linear-gradient(24deg,transparent 47%,#fffdf5 48%,#fffdf5 53%,transparent 54%),linear-gradient(112deg,transparent 37%,#fffdf5 38%,#fffdf5 43%,transparent 44%),linear-gradient(158deg,transparent 69%,#fffdf5 70%,#fffdf5 74%,transparent 75%),linear-gradient(66deg,transparent 19%,#fffdf5 20%,#fffdf5 24%,transparent 25%),#dce5d1}.park{position:absolute;left:49%;top:34%;width:35%;height:22%;background:#bfd5aa;border:2px solid #a7be90;border-radius:46% 22% 42% 18%;transform:rotate(-17deg)}.roadname{position:absolute;font-size:11px;color:#617263;font-weight:700}.r1{left:5%;top:47%;transform:rotate(24deg)}.r2{right:4%;top:29%;transform:rotate(-22deg)}.pin{position:absolute;min-width:44px;padding:6px 4px;text-align:center;border:2px solid white;outline:1px solid var(--ink);border-radius:4px;background:var(--green);color:white;font-weight:900;font-size:11px;box-shadow:0 2px 5px #24342f55}.p1{left:18%;top:39%}.p2{left:43%;top:56%;background:var(--red)}.p3{right:13%;top:45%;background:#8d9893;color:#16252c}.selected{border:2px solid var(--gold);transform:scale(1.12)}.bar{position:absolute;top:18px;left:16px;right:16px;padding:14px 15px;background:var(--paper);border:2px solid var(--ink);border-radius:5px;box-shadow:0 5px 0 #132b3a22;font-weight:800}.bar small{display:block;font-size:11px;color:#596b70;font-weight:600;margin-top:4px}.search{position:absolute;top:84px;left:16px;right:16px;padding:13px 15px;background:#fffcf3;border:1px solid #83918b;border-radius:4px;box-shadow:0 4px 12px #132b3a22}.search b{display:block;font-size:11px;color:#596b70}.search span{font-weight:800}.badge{position:absolute;top:146px;left:16px;background:#132b3a;color:#fff;padding:7px 10px;border-radius:3px;font-size:11px;letter-spacing:.04em}.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--paper);border-top:5px solid var(--gold);padding:15px 18px 21px;box-shadow:0 -8px 25px #132b3a22}.handle{width:42px;height:4px;margin:-7px auto 13px;background:#88928b;border-radius:9px}.title{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:900}.status{background:#d8eddf;color:#08633b;padding:6px 9px;border:1px solid var(--green);border-radius:3px;font-size:12px}.meta{margin-top:6px;color:#52646a;font-size:12px}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;margin:13px 0;border-top:1px solid #b9c0b5;border-bottom:1px solid #b9c0b5}.metrics div{padding:9px 5px;border-right:1px solid #b9c0b5;font-size:11px}.metrics b{display:block;color:var(--ink);font-size:13px}.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.button{background:var(--ink);color:white;border:0;padding:10px 13px;font-weight:800;border-radius:3px}.source{font-size:10px;color:#617178}
</style><body><main class="app"><section class="map" aria-label="示意街區地圖"><div class="park"></div><span class="roadname r1">中正路</span><span class="roadname r2">中華路一段</span><span class="pin p1">1/1 有</span><span class="pin p2 selected">0/1 占</span><span class="pin p3">? 未知</span></section><div class="bar">新莊・找車位 <small>示意底圖 · 車位狀態為介面示意</small></div><div class="search"><b>目的地</b><span>新莊體育館　⌕</span></div><div class="badge">逐格觀測　● 有位　■ 占用　? 未知</div><section class="sheet"><div class="handle"></div><div class="title"><span>中正路・路邊車格</span><span class="status">觀測空位 1 / 1</span></div><div class="meta">距目的地 180 m　·　一般汽車格</div><div class="metrics"><div>費率<b>依路段牌示</b></div><div>收費時間<b>官方未提供</b></div><div>資料品質<b>觀測可用</b></div></div><div class="footer"><span class="source">新北市官方來源 · 時間待回傳</span><button class="button">導航 →</button></div></section></main></body></html>
