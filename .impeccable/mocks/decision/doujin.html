<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動場刊索引｜首屏草圖</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0e8;color:#24272b;font:14px/1.35 system-ui,"Noto Sans TC",sans-serif}.app{height:844px;position:relative;overflow:hidden;background:#e4e7dc}.map{position:absolute;inset:0;background:repeating-linear-gradient(31deg,transparent 0 70px,#f9f6ed 71px 80px,transparent 81px 150px),repeating-linear-gradient(113deg,transparent 0 92px,#f9f6ed 93px 101px,transparent 102px 182px),#dfe7d7}.park{position:absolute;top:34%;left:48%;width:40%;height:22%;background:#bad4b7;clip-path:polygon(8% 0,100% 8%,90% 100%,0 83%)}.street{position:absolute;color:#7c8276;font-size:10px}.s1{left:4%;top:46%;transform:rotate(29deg)}.s2{right:4%;top:31%;transform:rotate(-25deg)}.mark{position:absolute;width:32px;height:32px;display:grid;place-items:center;background:#b83c36;color:white;border:2px solid white;box-shadow:0 0 0 1px #24272b;font-weight:900;font-size:11px}.a{left:18%;top:40%}.b{left:47%;top:52%;background:#d7b154;color:#222;transform:scale(1.12)}.c{right:12%;top:43%;background:#78818b}.head{position:absolute;top:14px;left:15px;right:15px;padding:11px 14px;background:#fffaf2;border:1px solid #d6cfc3;box-shadow:4px 4px 0 #24272b20}.head strong{font-size:15px;letter-spacing:.04em}.head small{float:right;color:#747b80;font-size:10px}.search{position:absolute;top:69px;left:15px;right:15px;padding:12px 13px;background:#fffdf7;border:1px solid #d4cbbd}.search small{display:block;color:#72787d;font-size:10px}.stamp{position:absolute;top:128px;left:16px;background:#24272b;color:#fffaf2;padding:7px 9px;font-size:10px;letter-spacing:.08em}.sheet{position:absolute;bottom:0;left:0;right:0;background:#fffaf2;border-top:4px solid #b83c36;padding:12px 16px 18px;box-shadow:0 -6px 24px #30383022}.toprow{display:flex;justify-content:space-between;align-items:end}.toprow h2{font-size:19px;margin:0}.count{font-size:11px;color:#747b80}.filter{display:flex;gap:6px;margin:10px 0}.chip{padding:5px 8px;border:1px solid #d2c9bc;border-radius:15px;font-size:10px}.chip.on{background:#24272b;color:white;border-color:#24272b}.entry{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-top:1px solid #ded8cf}.code{font-weight:900;color:#b83c36;font-size:14px}.entry b{font-size:12px}.entry small{display:block;color:#7a7e80;font-size:10px;margin-top:2px}.status{font-size:10px;padding:4px 7px;background:#e2f1e4;color:#28603a;border-radius:2px}.foot{font-size:10px;color:#72787d;margin-top:8px}
</style><body><main class="app"><section class="map" aria-label="示意街區地圖"><div class="park"></div><span class="street s1">中正路</span><span class="street s2">中華路一段</span><span class="mark a">A01</span><span class="mark b">B04</span><span class="mark c">C02</span></section><header class="head"><strong>新莊停車索引　/　街區場刊</strong><small>示意畫面</small></header><div class="search"><small>目的地</small>新莊體育館　⌕</div><div class="stamp">地圖與索引同號　·　12 個結果</div><section class="sheet"><div class="toprow"><h2>附近格位索引</h2><span class="count">依距離排序</span></div><div class="filter"><span class="chip on">全部</span><span class="chip">路邊</span><span class="chip">路外</span><span class="chip">只看有位</span></div><div class="entry"><span class="code">B04</span><div><b>中正路・路邊格</b><small>180 m　·　官方觀測時間待提供</small></div><span class="status">有位</span></div><div class="entry"><span class="code">C02</span><div><b>新莊路・路邊格</b><small>240 m　·　狀態未知</small></div><span class="status" style="background:#ecece8;color:#555">未知</span></div><div class="foot">示意資料｜品質與抵達時間預測分開顯示</div></section></main></body></html>
